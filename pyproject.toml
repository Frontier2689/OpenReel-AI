[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openreel-ai"
version = "0.1.0"
description = "Prompt-to-video Windows desktop application"
requires-python = ">=3.11"
dependencies = ["requests==2.32.5", "keyring==25.6.0"]

[tool.setuptools.packages.find]
include = ["openreel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
