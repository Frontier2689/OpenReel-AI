name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --editable .
      - name: Verify repository layout
        shell: pwsh
        run: |
          $required = @(
            "pyproject.toml",
            "openreel/__init__.py",
            "openreel/__main__.py",
            "tests/test_planner.py"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required repository file is missing: $path. Extract the source ZIP without flattening its folders."
            }
          }
      - name: Test
        run: python -m pytest tests/test_planner.py
      - name: Lint
        run: python -m ruff check .
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg-dist -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName bin/ffprobe.exe
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm openreel.spec
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/OpenReelAI.exe,README.md,LICENSE -DestinationPath OpenReel-AI-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenReel-AI-Windows
          path: OpenReel-AI-Windows.zip
      - name: Attach tagged build to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenReel-AI-Windows.zip
